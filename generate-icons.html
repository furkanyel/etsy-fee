<!DOCTYPE html>
<html>
<head>
  <title>Icon Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      text-align: center;
    }
    canvas {
      margin: 10px;
      border: 1px solid #ccc;
    }
    .download-section {
      margin: 20px 0;
    }
    button {
      padding: 10px 20px;
      margin: 5px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background: #764ba2;
    }
  </style>
</head>
<body>
  <h1>Etsy Fee Calculator Icon Generator</h1>
  <p>Bu sayfayı tarayıcınızda açın ve butonlara tıklayarak ikonları indirin.</p>

  <div class="download-section">
    <button onclick="downloadIcon(16)">Download 16x16</button>
    <button onclick="downloadIcon(48)">Download 48x48</button>
    <button onclick="downloadIcon(128)">Download 128x128</button>
  </div>

  <div id="canvases"></div>

  <script>
    function createIcon(size) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      // Gradient background
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#667eea');
      gradient.addColorStop(1, '#764ba2');

      // Draw rounded rectangle
      const radius = size / 5;
      ctx.beginPath();
      ctx.moveTo(radius, 0);
      ctx.lineTo(size - radius, 0);
      ctx.quadraticCurveTo(size, 0, size, radius);
      ctx.lineTo(size, size - radius);
      ctx.quadraticCurveTo(size, size, size - radius, size);
      ctx.lineTo(radius, size);
      ctx.quadraticCurveTo(0, size, 0, size - radius);
      ctx.lineTo(0, radius);
      ctx.quadraticCurveTo(0, 0, radius, 0);
      ctx.closePath();
      ctx.fillStyle = gradient;
      ctx.fill();

      // Draw dollar sign
      ctx.fillStyle = 'white';
      ctx.font = `bold ${size / 5}px Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('$', size / 2, size / 3);

      // Draw E
      ctx.font = `bold ${size / 1.8}px Arial`;
      ctx.fillText('E', size / 2, size * 0.65);

      return canvas;
    }

    function downloadIcon(size) {
      const canvas = createIcon(size);
      const link = document.createElement('a');
      link.download = `icon${size}.png`;
      link.href = canvas.toDataURL();
      link.click();
    }

    // Display canvases
    const canvasesDiv = document.getElementById('canvases');
    [16, 48, 128].forEach(size => {
      const canvas = createIcon(size);
      canvasesDiv.appendChild(canvas);
      const label = document.createElement('p');
      label.textContent = `${size}x${size}`;
      canvasesDiv.appendChild(label);
    });
  </script>
</body>
</html>
