<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etsy Fee Calculator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Etsy Ücret & Kâr Hesaplayıcı</h1>

    <div class="input-section">
      <div class="input-group">
        <label for="itemPrice">Ürün Fiyatı ($)</label>
        <input type="number" id="itemPrice" placeholder="0.00" step="0.01" min="0">
      </div>

      <div class="input-group">
        <label for="shippingCost">Kargo Ücreti ($)</label>
        <input type="number" id="shippingCost" placeholder="0.00" step="0.01" min="0" value="0">
      </div>

      <div class="input-group">
        <label for="productCost">Ürün Maliyeti ($)</label>
        <input type="number" id="productCost" placeholder="0.00" step="0.01" min="0" value="0">
      </div>

      <div class="input-group">
        <label for="quantity">Adet</label>
        <input type="number" id="quantity" placeholder="1" min="1" value="1">
      </div>

      <div class="checkbox-group">
        <label>
          <input type="checkbox" id="offsiteAds">
          Offsite Ads (15%)
        </label>
      </div>

      <div class="checkbox-group">
        <label>
          <input type="checkbox" id="offsiteAdsHigh">
          Offsite Ads - Yüksek Satış (12%)
        </label>
      </div>
    </div>

    <button id="calculateBtn">Hesapla</button>

    <div id="results" class="results" style="display: none;">
      <h2>Sonuçlar</h2>

      <div class="result-item">
        <span class="label">Toplam Satış Fiyatı:</span>
        <span class="value" id="totalSalePrice">$0.00</span>
      </div>

      <div class="fees-breakdown">
        <h3>Etsy Ücretleri</h3>

        <div class="result-item">
          <span class="label">Listeleme Ücreti:</span>
          <span class="value" id="listingFee">$0.20</span>
        </div>

        <div class="result-item">
          <span class="label">İşlem Ücreti (6.5%):</span>
          <span class="value" id="transactionFee">$0.00</span>
        </div>

        <div class="result-item">
          <span class="label">Ödeme İşlem Ücreti (3% + $0.25):</span>
          <span class="value" id="paymentFee">$0.00</span>
        </div>

        <div class="result-item" id="offsiteAdsFeeRow" style="display: none;">
          <span class="label">Offsite Ads:</span>
          <span class="value" id="offsiteAdsFee">$0.00</span>
        </div>

        <div class="result-item total">
          <span class="label">Toplam Etsy Ücretleri:</span>
          <span class="value" id="totalFees">$0.00</span>
        </div>
      </div>

      <div class="profit-section">
        <div class="result-item">
          <span class="label">Ürün Maliyeti:</span>
          <span class="value" id="displayProductCost">$0.00</span>
        </div>

        <div class="result-item profit">
          <span class="label">Net Kâr:</span>
          <span class="value" id="netProfit">$0.00</span>
        </div>

        <div class="result-item">
          <span class="label">Kâr Marjı:</span>
          <span class="value" id="profitMargin">0%</span>
        </div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
